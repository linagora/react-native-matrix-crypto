name: ci

on:
  pull_request:
  push:
    branches: [main]
  # .github/workflows/release.yml calls this file rather than repeating its
  # jobs. A release path with its own copy of the checks is how a broken
  # artifact ships: the copy drifts weaker, quietly, and the first sign is a
  # published package. Nothing else about this workflow changes -- when it is
  # called, the caller's ref is what every `actions/checkout` here checks out,
  # so a tag run gates exactly the commit being released.
  workflow_call:

# Nothing here writes to the repository: every job checks out, builds, and
# asserts. `release.yml` and `docs.yml` already say so for themselves; this
# file inherited whatever the repository's default happened to be, which on a
# `push: main` run or a `workflow_call` from a release is a token with more
# rights than any step needs.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - run: yarn install --frozen-lockfile
      # Lint and formatting first. They take seconds, they need nothing built,
      # and they are the two failures a contributor is most likely to arrive
      # with -- there is no sense spending a Rust build to report them second.
      #
      # Neither is a `gate:*` script, so gate:readme does not require a row for
      # them in the README's table; the paragraph under that table is what says
      # they run, and this comment is the other half of that promise.
      #
      # `--max-warnings 0` lives in the `lint` script rather than on this line,
      # so that `yarn lint` on a laptop and `yarn lint` here are the same
      # command and cannot come to different answers.
      - run: yarn lint
      # `yarn lint` above blocks on findings -- it exits 1 on an error and,
      # through --max-warnings 0, on a warning too. What it cannot do is tell
      # anyone it linted the WRONG SET: `eslint .` exits 0 whether it found
      # nothing wrong or opened nothing at all, and a file it never read is
      # indistinguishable from a clean one.
      #
      # packages/example-app/vitest.config.mts sat unlinted through this
      # milestone and through a green run of the step above, because `.mts`
      # fell between the shareable config's `**/*.ts` and ESLint's own default
      # extensions. A reviewer found it. This is the mechanism that would have.
      - run: yarn gate:lint-coverage
      - run: yarn format:check
      - run: yarn gate:workspaces
      - run: yarn gate:boundary
      - run: yarn gate:drift
      # gate:drift proves the committed bindings MATCH the Rust source. It
      # cannot prove they WORK: it regenerates and diffs, so two equally
      # broken generations agree with each other. gate:stubs reads the
      # committed artifacts and asserts the turbo module is actually wired up.
      - run: yarn gate:stubs
      # The two ignore lists this repository maintains by hand -- one in
      # .prettierignore, one in eslint.config.mjs -- really do cover every path
      # in scripts/generated-paths.txt, asked of Prettier and ESLint themselves
      # rather than compared as strings. It runs next to gate:stubs because it
      # guards the same thing from the other side: gate:drift is what makes a
      # generated file's bytes load-bearing, and a formatter is the one tool
      # here that rewrites files nobody asked it to.
      - run: yarn gate:ignores
      - run: yarn gate:logger
      - run: yarn gate:agility
      # Wired in the same change that added it, because this repository has
      # already shipped a gate that existed and ran nowhere (see gate:readme
      # below, added on 2026-08-28 and invoked by no workflow at all). It
      # asserts that every name a public module exports reaches src/index.ts,
      # which nothing checked: the entire M3 verification surface could be
      # deleted from the entry point with every other check here green.
      - run: yarn gate:surface
      # scripts/measure-signal-latency.sh decides whether a B2 A/B measurement
      # is an A/B at all, and two of its guards shipped unable to fire -- one
      # of them through two review cycles. Both were found by running the case,
      # not by reading and not by shellcheck, which passes on both. This faces
      # four of that script's thirteen refusals -- the four that have broken --
      # with what each refuses, plus the accepting case, and asserts every field
      # of every row the accepted run writes. On fixtures it builds itself: no
      # device, no emulator, no SDK, a few hundred milliseconds.
      - run: yarn gate:measure-guards
      # The sibling of the gate above, for the other measurement this
      # repository records. scripts/measure-artifacts.sh refuses to record an
      # artifact size measured from a binary that was not built from the Rust
      # in the tree -- a real measurement of the wrong artifact reads exactly
      # like a real measurement of the right one, and it had caught that once.
      # It established provenance by comparing modification times, which did
      # not survive CI: release run 33261962635 refused a framework built in
      # that same run, from that same commit, because the tar carrying it
      # between jobs preserved build times older than the checkout.
      #
      # Replacing a proxy with an identity is the kind of fix whose wrong
      # version -- weaken the gate until the release passes -- is green and
      # reads the same. So this runs both directions on both paths: a binary
      # from another commit is refused with and without the CI stamp, an
      # unstamped binary is refused rather than downgraded on the CI path, a
      # genuinely stale binary is still refused locally, and the correctly
      # built binary whose modification times are older than the checkout is
      # accepted. On a git fixture it builds itself: no Rust, no cross-compile.
      - run: yarn gate:artifact-provenance
      # gate:readme was written on 2026-08-28, added to package.json, and
      # wired into no workflow at all. It worked, it was never invoked, and
      # the README's gate table sat under the sentence "Every one of these
      # runs in CI." while omitting it. A gate that exists and never runs is
      # the pattern this milestone has now found repeatedly; this one was
      # added while closing the others.
      #
      # It compares the root README against the copy npm publishes. Those two
      # have already drifted once, in the direction a consumer arriving from
      # npm would not see.
      - run: yarn gate:readme
      # The README's worked example for the signing-keys authentication loop
      # must run the same steps as the test that proves it. That loop is the
      # one path this library hands to a product whole, so its example is
      # most of what a product has to go on, and an example that drifts from
      # the proof is worse than none.
      - run: yarn gate:uia-example
      # A doc link is a claim that a name exists. Nothing checked it, and
      # three were false at once; the one that mattered pointed at a
      # constant the code-scanning opt-in had deleted, inside a sentence
      # that was false for the same reason. It runs after the clippy step
      # below has warmed nothing, and pays a doc build of two crates and no
      # dependencies: about two seconds on a machine that has already built
      # the workspace, which every earlier step in this job has.
      - run: yarn gate:doc-links
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      # gate:boundary already runs matrix-crypto-core's own tests as part of
      # the boundary check, but it passes `-p matrix-crypto-core`, and
      # `cargo clippy --all-targets` above only COMPILES
      # matrix-crypto-ffi/tests/*, it never executes them. Without this step
      # the FFI crate's tests never run on a pull request at all.
      #
      # This comment used to say the workspace had 8 tests, 6 of them the
      # core crate's. It said that while `--list` reported 59, and 61 the
      # next day. A count nobody maintains is worse than no count: it reads
      # as a fact and decays into a lie, which is the defect this milestone
      # spent a day paying for. The structural reason above is the reason,
      # and it does not rot.
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: yarn --cwd packages/react-native-matrix-crypto typecheck
      # The example app compiles the library's shipped `interop/` sources
      # directly, under different `lib` and `types` settings than the library
      # itself uses. A `new Promise((resolve) => setTimeout(resolve, ms))` in
      # interop/suite.ts type-checked in the library and did NOT type-check
      # here -- React Native types setTimeout's callback as `() => void` while
      # Promise's resolve takes a value -- so the shipped suite stopped
      # compiling against its own consumer, and the only reason anyone found
      # out was a person running tsc by hand.
      #
      # Two typechecks, not one, because they are genuinely two questions.
      - run: yarn --cwd packages/example-app typecheck
      - run: yarn --cwd packages/react-native-matrix-crypto test
      # packages/example-app had no test runner at all until 2026-08-30, and
      # that is not a gap in coverage so much as the reason two defects
      # shipped in one day. The guided walkthrough is the screen a developer
      # opens first to decide whether to adopt this library, and it is the
      # only place the published TypeScript surface is driven end to end.
      # Step 3 spent a release reporting "no signal received" on a device
      # whose very same launch logged PROBE_SUMMARY 12/12. Step 6 spent a
      # milestone reporting "unexpected" because its card asserted that a
      # library function was unimplemented after M3 implemented it. Both were
      # found by a person holding a phone, because nothing else could look.
      #
      # Vitest, matching the library package, so a contributor meets one
      # convention rather than two. It runs the walkthrough's real step
      # functions, not a copy of them, and one of its files mocks nothing at
      # all: a card that claims something about the library is checked
      # against the library. What it cannot reach is the JSI turbo module,
      # which no Node process can load; see packages/example-app/README.md.
      - run: yarn --cwd packages/example-app test

  cold-consume:
    # Spec section 4bis.2: installing this package requires no Rust
    # toolchain. GitHub's hosted ubuntu-latest runner ships a Rust
    # toolchain by default, so cargo/rustc are scrubbed from PATH for this
    # job rather than left alone -- otherwise this job would prove nothing.
    #
    # WHAT THIS JOB DOES NOT PROVE, said here because the README used to say
    # it did. It called this "a job that installs the real tarball", and the
    # tarball is not the real one: .gitignore ignores *.xcframework and *.aar
    # and `git ls-files` tracks neither, so the checkout this job packs from
    # holds no prebuilt binary at all. Measured 2026-08-28 by packing a
    # `git archive HEAD` checkout, which is exactly what actions/checkout
    # gives this job: 68 KB, zero .aar, .xcframework, .so, .a or .dylib
    # entries. The published tarball is 68 MB and is built by the release
    # workflow.
    #
    # It cannot be fixed by packing harder. The binaries are build outputs of
    # the two build legs -- an hour of macos-15 minutes for the xcframework --
    # so packing them means paying for both builds on every PR to test a
    # locally assembled tarball that still is not the published one. And the
    # final step cannot load the module even if they were there:
    # `require('react-native-matrix-crypto')` in plain node throws
    # ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING, because `main` is
    # src/index.ts and node refuses to strip types inside node_modules
    # (observed 2026-08-28). A JSI turbo module needs a React Native runtime
    # regardless. probe-android is the job that runs the shipped chain.
    #
    # So this job asserts the narrower property it can actually establish,
    # and the README now claims that and no more: with cargo and rustc
    # unreachable, the package installs, nothing in it can invoke a compiler
    # while installing, and its entry point resolves to a real file inside
    # the installed package.
    #
    # PATH is scrubbed rather than deleting the runner's toolchain from disk
    # (e.g. `sudo rm -f $(command -v cargo)`): deletion is destructive --
    # it would wreck a self-hosted runner or a local `act` run -- and PATH
    # manipulation proves the identical property (cargo is unreachable)
    # without it. Every directory that carries a cargo or rustc binary is
    # excluded, rather than one hardcoded path, so this does not depend on
    # exactly where the runner happens to install Rust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc' }
      - name: Prove the consumer installs with no Rust toolchain reachable
        run: |
          NEW_PATH=""
          IFS=':' read -ra DIRS <<< "$PATH"
          for d in "${DIRS[@]}"; do
            if [ -x "$d/cargo" ] || [ -x "$d/rustc" ]; then
              echo "Scrubbing $d from PATH (carries cargo/rustc)"
              continue
            fi
            NEW_PATH="${NEW_PATH:+$NEW_PATH:}$d"
          done
          export PATH="$NEW_PATH"

          # A bare `! command -v cargo` looks like the obvious assertion,
          # but under bash's errexit (the default for Actions run steps), a
          # `!`-negated command is explicitly exempt from triggering exit-on-
          # failure (POSIX/bash documented behaviour). If cargo were somehow
          # still reachable, that line would silently do nothing instead of
          # failing the job -- exactly the case this step exists to catch.
          # An explicit if/exit does not have that hole.
          if command -v cargo >/dev/null 2>&1; then
            echo "FAIL: cargo is still reachable at $(command -v cargo)"
            exit 1
          fi
          if command -v rustc >/dev/null 2>&1; then
            echo "FAIL: rustc is still reachable at $(command -v rustc)"
            exit 1
          fi
          echo "Confirmed: cargo and rustc are unreachable"

          TARBALL=$(cd packages/react-native-matrix-crypto && npm pack --silent)
          TARBALL_PATH="$GITHUB_WORKSPACE/packages/react-native-matrix-crypto/$TARBALL"
          if [ ! -s "$TARBALL_PATH" ]; then
            echo "FAIL: npm pack produced no tarball at $TARBALL_PATH"
            echo "      Refusing to pass having installed nothing."
            exit 1
          fi
          echo "Packed $TARBALL ($(du -h "$TARBALL_PATH" | cut -f1)):"
          tar tzf "$TARBALL_PATH" | sed 's#^package/##' | cut -d/ -f1 | sort -u | sed 's/^/  /'

          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$TARBALL_PATH"

          # Read the INSTALLED package, which is what a consumer gets, not
          # the one in the checkout.
          #
          # The PATH scrub proves cargo is unreachable. This proves the
          # package never asks for it: npm runs preinstall/install/postinstall
          # and (for some install shapes) prepare, and node-gyp compiles
          # whenever a binding.gyp is present even with no script declared.
          # A package with none of those cannot compile anything at install
          # time on any consumer's machine, which is the property "no Rust
          # toolchain is required" actually rests on.
          node -e '
            const fs = require("fs");
            const dir = "node_modules/react-native-matrix-crypto";
            const pkg = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
            const forbidden = ["preinstall", "install", "postinstall", "prepare"];
            const found = forbidden.filter(s => (pkg.scripts || {})[s]);
            if (found.length) {
              console.error("FAIL: the installed package declares install-time scripts: " + found.join(", "));
              console.error("      Any of them can invoke a compiler on a consumer machine.");
              process.exit(1);
            }
            if (fs.existsSync(dir + "/binding.gyp")) {
              console.error("FAIL: the installed package ships a binding.gyp, so npm would");
              console.error("      run node-gyp against it at install time.");
              process.exit(1);
            }
            const resolved = require.resolve("react-native-matrix-crypto");
            const expected = fs.realpathSync(dir);
            if (!fs.realpathSync(resolved).startsWith(expected)) {
              console.error("FAIL: react-native-matrix-crypto resolved to " + resolved);
              console.error("      which is outside the installed package at " + expected + ".");
              process.exit(1);
            }
            if (fs.statSync(resolved).size === 0) {
              console.error("FAIL: the entry point " + resolved + " is empty.");
              process.exit(1);
            }
            console.log("Installed with no Rust toolchain reachable, no install-time");
            console.log("script, no binding.gyp; entry point resolves to " + resolved);
          '

  audit:
    # `npm audit` over what installing this package actually pulls onto a
    # consumer's machine. scripts/audit-dependencies.sh carries the reasoning:
    # which tree it reads and why it reads the packed tarball rather than the
    # checkout, why npm cannot read this workspace at all, and why its two
    # thresholds differ.
    #
    # Its own job, for two reasons. It needs no `yarn install`, no Rust and no
    # build, so it starts immediately and finishes in about a minute rather
    # than queueing behind `gates`. And it is the only check in this workflow
    # that can turn red on a commit that passed yesterday, with nothing in the
    # repository having moved -- a new advisory should read as a new advisory
    # and not as the gates job failing.
    #
    # The script is invoked by path rather than through `yarn audit:deps`,
    # which is the same script: this job installs no dependencies, and there is
    # no sense making an audit depend on a package manager it does not use.
    # `yarn audit:deps` is for running it on a laptop.
    #
    # `needs:` is deliberately absent. A dependency advisory is worth hearing
    # about on a pull request whose formatting is wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc' }
      - run: ./scripts/audit-dependencies.sh

  build-ios:
    # On pull requests this leg builds only the simulator slice, because
    # macOS runners are the cost centre. The full cross-compile matrix
    # (device + simulator + all architectures) belongs to the tag-triggered
    # release workflow, not here.
    #
    # `needs: gates` is not about runner minutes: `gates` runs gate:drift,
    # the only check proving the committed bindings match the Rust source.
    # This job's own `--and-generate` regenerates and builds whatever it
    # produces, without ever diffing against what is committed -- so on a PR
    # with drifted bindings, this leg would otherwise go green against code
    # that is not what is actually committed.
    #
    # IF YOU ADD AN iOS END-TO-END LEG HERE, copy probe-android's assertion.
    # The rule holds on both platforms: the leg must assert that it FOUND a
    # `PROBE_SUMMARY n/n` line, exactly one, reading what was expected. It
    # must never pass because no FAIL line appeared -- an app that crashed on
    # launch and an app that was never installed both print no FAIL line
    # either, and reading that absence as success is the failure this
    # milestone has now found repeatedly.
    #
    # Three practical notes for whoever writes it. React Native does forward
    # JS console output to the iOS system log, at info level under subsystem
    # com.facebook.react.log, category javascript -- but `log stream` and
    # `log show` exclude info-level messages unless asked (measured on a
    # booted iOS 26.5 simulator, 2026-08-28: no level flag, zero PROBE_ lines;
    # `--level info`, all fourteen including the summary).
    #
    # A booted simulator also keeps NO log archive: `log show --last 2m`
    # inside one returns nothing, it does not accept `--level` there at all,
    # and the host's own log does not carry the simulator's messages either.
    # So there is no `logcat -d` to read after the fact. A live `log stream`
    # is the only route, it has to be attached before the app emits anything,
    # and a leg that does not prove it was attached will read a launch it
    # captured late as an app that printed nothing.
    # scripts/measure-signal-latency-ios.sh carries a worked answer to that:
    # its own `simctl uninstall` makes `installd` log the bundle identifier,
    # and it launches nothing until that line is in the capture.
    #
    # And it is not built here because of cost rather than feasibility: a
    # release `ubrn build ios` plus pod install, xcodebuild, boot, install and
    # launch is roughly an hour of macos-15 minutes per PR, against ubuntu
    # minutes for probe-android, which already runs the same chain end to
    # end.
    needs: gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - run: yarn install --frozen-lockfile
      # The iOS sibling of gate:measure-guards, which runs in `gates`. It
      # lives here rather than there because it needs `plutil` to read a
      # bundle's Info.plist, and `plutil` is macOS only, as is the harness
      # it faces. It needs nothing else this job provides: no simulator, no
      # Xcode project, no Rust, a few hundred milliseconds on fixtures it
      # builds itself. It runs before the long build for that reason.
      - run: yarn gate:measure-guards-ios
      # rust-toolchain.toml pins the channel and lists this target, and
      # rustup auto-installs both from the toolchain file on first use --
      # this is belt-and-suspenders, cheap, and a no-op if already present.
      - run: rustup target add aarch64-apple-ios-sim
      - name: Build the iOS simulator slice
        run: |
          # `yarn --cwd packages/react-native-matrix-crypto exec ubrn -- ...`
          # does NOT change the child process's working directory in this
          # yarn 1.x install (empirically confirmed: `yarn --cwd "$PKG" exec
          # -- pwd` prints the workspace root, not "$PKG" -- the same quirk
          # scripts/assert-facade-agility.sh already works around). Without
          # this `cd`, `--config ../../ubrn.config.yaml` resolves from the
          # wrong directory and ubrn fails with "File ../../ubrn.config.yaml
          # does not exist". A real `cd` sidesteps the quirk entirely.
          cd packages/react-native-matrix-crypto
          yarn exec ubrn -- build ios \
            --config ../../ubrn.config.yaml \
            --targets aarch64-apple-ios-sim \
            --release --and-generate
      # Not redundant with the `gates` job, and not safe to delete as such.
      # `gates` runs on a different runner with its own checkout: nothing it
      # does can see the tree `--and-generate` leaves behind HERE. This step
      # is the only check that reads that tree.
      #
      # `--and-generate` above rewrites src/index.tsx and the C++ install shim
      # from whatever it can read out of the artifact it just built. On the
      # Android leg that produces silent stubs -- see
      # scripts/assert-generated-not-stubbed.sh for the mechanism and the
      # evidence, and the build-android job below for why that leg no longer
      # passes the flag. This leg feeds it a static archive, which carries the
      # UniFFI metadata symbols the extraction needs, so it regenerates
      # identical output today -- but "today" is a property of the config and
      # of ubrn's version, not a guarantee.
      - run: yarn gate:stubs
      # Stamp the commit this framework was built from, then measure with the
      # identity check REQUIRED rather than merely available. The binary is
      # built in this job, so this leg would pass either way -- which is the
      # point: the release path's mechanism is exercised on every pull
      # request instead of being first tried at release time. Release run
      # 33261962635 failed on a `pack` step no pull request runs.
      - run: ./scripts/record-build-provenance.sh ios packages/react-native-matrix-crypto/MatrixCryptoFramework.xcframework
      - run: ./scripts/measure-artifacts.sh ci-ios
        env:
          REQUIRE_BUILD_PROVENANCE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: artifact-sizes-ios, path: artifact-sizes.json }

  build-android:
    # `needs: gates` is worth having, and NOT for the reason that used to be
    # written here. This paragraph was copied from build-ios, where it is
    # correct, and it is inverted here: it claimed this leg "builds whatever
    # is in the checkout without ever diffing it against the Rust surface, so
    # on a PR with drifted bindings this leg would otherwise go green against
    # code that is not what is committed." This job deliberately omits
    # `--and-generate` -- the paragraph on the build step below says so at
    # length -- so it builds exactly what IS committed. Drifted bindings are
    # not a way for this leg to build something else.
    #
    # The real reason is cheaper and duller: this leg costs a release Rust
    # build for Android plus a Gradle build, and there is no sense spending
    # that on a pull request whose bindings, formatting, clippy, tests or
    # typechecks have already gone red in `gates`. It also keeps the failure
    # a reader sees first the one that names the cause.
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: rustup target add x86_64-linux-android
      # cargo-ndk is a separate cargo plugin, not part of any Rust toolchain
      # and not bundled with ubrn or preinstalled on GitHub-hosted runners --
      # confirmed directly against uniffi-bindgen-react-native's own
      # pre-installation docs (node_modules/uniffi-bindgen-react-native/
      # docs/src/guides/rn/pre-installation.md): "cargo install cargo-ndk"
      # is a required, explicit prerequisite for `ubrn build android`.
      # Pinned exact + --locked, per spec section 4's "every pin is exact"
      # (cargo-ndk is the same pre-1.0-adjacent-tooling class as ubrn itself)
      # -- and cached by that exact version, so a routine run does not
      # rebuild it from source on every job; the install step below is
      # skipped outright on a cache hit.
      - id: cargo-ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2
      - if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the x86_64 Android slice
        run: |
          # Same yarn --cwd + exec quirk as build-ios; see that job's comment.
          #
          # DELIBERATELY NOT `--and-generate`. On Android that flag exits 0,
          # prints no warning, and rewrites src/index.tsx and
          # cpp/react-native-matrix-crypto.cpp into stubs: no
          # `export * from './generated/matrix_crypto'`, and an
          # installRustCrate() whose body is a bare `return true;` with no JSI
          # registration at all. ubrn.config.yaml sets
          # `android.useSharedLibrary: true`, so the artifact handed to
          # metadata extraction is the cdylib, whose UniFFI metadata lives in
          # .dynsym while the extractor reads .symtab -- zero modules found,
          # and both files are rendered from templates that loop over the
          # module list. Reproduced 2026-08-28 against ubrn 0.31.0-5;
          # scripts/assert-generated-not-stubbed.sh carries the full evidence.
          # Nothing here needs regenerating anyway: gate:drift in `gates`
          # already proves the committed bindings match the Rust source, and
          # this job only needs the compiled slice.
          cd packages/react-native-matrix-crypto
          yarn exec ubrn -- build android \
            --config ../../ubrn.config.yaml \
            --targets x86_64-linux-android \
            --release
      # The tripwire for the paragraph above: if anyone puts `--and-generate`
      # back, or a future ubrn regresses the same way on its own, the stub is
      # caught here. Not redundant with `gates` -- that job has its own
      # runner and its own checkout and cannot see this tree.
      - run: yarn gate:stubs
      # The same stamp-then-measure the iOS leg above runs, for the same
      # reason: both release legs hand their binary to `pack` through a tar,
      # so both need the identity check, and neither should meet it for the
      # first time during a release.
      - run: ./scripts/record-build-provenance.sh android packages/react-native-matrix-crypto/android/src/main/jniLibs
      - run: ./scripts/measure-artifacts.sh ci-android
        env:
          REQUIRE_BUILD_PROVENANCE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: artifact-sizes-android, path: artifact-sizes.json }

  probe-android:
    # The only job that runs this library's code on a device.
    #
    # Every fast check in this repo stayed green for the whole of M2 while the
    # example app's probe was failing on real native code:
    # `getDeviceIdentityKeys` began refusing a caller that names a different
    # identity than the live machine holds, and the probe called it with no
    # machine created at all. cargo test, vitest, tsc and all five gates
    # passed throughout, and the breakage was found by a person launching the
    # app by hand (task-10-report.md, finding 1). Nothing cheaper than running
    # it would have caught that, so this job runs it.
    #
    # It is slow on purpose. A release Rust build for Android plus a Gradle
    # release build plus an emulator boot is most of an hour, against seconds
    # for `gates`. That is the price of the only check here that executes the
    # shipped chain end to end.
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - run: yarn install --frozen-lockfile
      - run: rustup target add x86_64-linux-android
      # Same pin and cache as build-android; see that job for why cargo-ndk is
      # a required, explicit prerequisite.
      - id: cargo-ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2
      - if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the x86_64 Android slice
        run: |
          # NOT `--and-generate`, and this job is where it matters most: on
          # Android that flag rewrites the turbo module into a stub that
          # exports nothing and registers nothing with JSI (see build-android
          # above). An app built on that output installs, launches, and then
          # fails every native call -- which reads exactly like a
          # cryptography failure in the probe output.
          #
          # For the same reason this job does not reuse anything
          # build-android produces: that job's tree is not something an app
          # can be built from, and depending on it would make this leg's
          # correctness depend on that leg's flags.
          cd packages/react-native-matrix-crypto
          yarn exec ubrn -- build android \
            --config ../../ubrn.config.yaml \
            --targets x86_64-linux-android \
            --release
      # Assert the tree this APK is about to be built from is a real turbo
      # module, so a stub fails here with a message rather than three steps
      # later as an unexplained probe failure on the emulator.
      - run: yarn gate:stubs
      - name: Assemble a release APK with the JS bundled in
        run: |
          # Release, not debug: a debug APK loads its JavaScript from a Metro
          # server, so a debug run would be testing Metro's availability as
          # much as the bridge. A release APK carries the Hermes bytecode
          # inside it and needs nothing else running.
          #
          # Confirmed on a local emulator before this job was written: a
          # release build still forwards `console.log` to logcat under the
          # ReactNativeJS tag, so the PROBE_ lines the script below reads are
          # there.
          cd packages/example-app/android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM and refuse to continue without it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Without /dev/kvm the x86_64 emulator either refuses to start or
          # crawls, and this job would fail several minutes later with "no
          # PROBE_SUMMARY was printed" -- true, but pointing at the app rather
          # than at the runner. GitHub's x86_64 ubuntu runners provide KVM;
          # the arm64 ones do not, so a future `runs-on` change lands here.
          if [ ! -e /dev/kvm ]; then
            echo "FAIL: /dev/kvm is not present on this runner."
            echo "      An x86_64 Android emulator needs hardware acceleration."
            echo "      If this runner cannot provide it, this job needs a"
            echo "      self-hosted runner rather than a longer timeout."
            exit 1
          fi
          ls -l /dev/kvm
      - name: Run the probe on an emulator
        # Pinned to a commit, not to `v2`. This is the only action here that
        # is not `actions/*`, and `v2` is a tag its owner can move: whoever
        # holds it decides what runs on this runner. The SHA is v2.38.0.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # The assertion lives in the script, not here, so it can be run by
          # hand against a local emulator exactly as CI runs it. It asserts on
          # the verbatim `PROBE_SUMMARY n/n` line -- not on an exit code, and
          # never on the absence of a FAIL line.
          script: ./scripts/run-probe-on-emulator.sh

  probe-ios:
    # The iOS twin of probe-android, and the first job that exercises this
    # library end to end on iOS: until this job existed, ci.yml ran no iOS
    # end to end leg at all, and the only iOS runtime evidence was a manual
    # measurement script (scripts/measure-signal-latency-ios.sh) whose record
    # lives outside this repository.
    #
    # The app side needs nothing iOS-specific: the probe harness prints
    # PROBE_CHECK and PROBE_SUMMARY through console.log, which reaches the
    # unified log at info level under subsystem com.facebook.react.log. What
    # this leg reimplements is every piece of adb -- boot, install, launch,
    # and a live `log stream` with a readiness beacon, because a booted
    # simulator keeps no log archive to query after the fact.
    #
    # Cost is the reason this job arrived last: an hour of macos-15 per pull
    # request, against minutes for the Android leg on ubuntu.
    needs: gates
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - run: yarn install --frozen-lockfile
      # Same rule as probe-android: this leg rebuilds its own Rust slice
      # rather than reusing build-ios output, because probe correctness must
      # not depend on another leg's flags.
      - run: rustup target add aarch64-apple-ios-sim
      - name: Build the Rust slice for the simulator
        run: |
          cd packages/react-native-matrix-crypto
          yarn exec ubrn -- build ios \
            --config ../../ubrn.config.yaml \
            --targets aarch64-apple-ios-sim \
            --release
      # Same reasoning as probe-android: gates ran on a different runner and
      # cannot see the tree this build leaves behind.
      - run: yarn gate:stubs
      # A real `cd`, not `--project-directory`: the latter leaves the
      # autolinking CLI's node process running from the invoking directory,
      # and it then resolves the workspace root's package.json -- which
      # names no react-native project -- so `use_native_modules!` parses a
      # config without a `project` key and the Podfile fails with
      # "undefined method `[]' for nil". Watched failing that way in CI on
      # 2026-09-01 and reproduced locally; from inside ios/ the CLI walks up
      # to the example app's package.json, which is the project.
      - name: Install pods
        run: |
          cd packages/example-app/ios
          pod install
      - name: Build the example app for a simulator
        # ARCHS=arm64 is load-bearing, not an optimisation: the slice this
        # leg builds is aarch64-apple-ios-sim only, and a generic simulator
        # destination also compiles x86_64, under which the [CP] Copy
        # XCFrameworks phase finds no matching slice and the link fails on
        # 'matrix_crypto_ffi' for both architectures. macos-15 runners are
        # Apple Silicon, so arm64-only loses nothing.
        run: |
          xcodebuild \
            -workspace packages/example-app/ios/ExampleApp.xcworkspace \
            -scheme ExampleApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/rnmc-probe-ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build
      # The assertion lives in the script, not here, the same rule
      # probe-android keeps: it can be run by hand against a local simulator
      # exactly as CI runs it, and it asserts on the verbatim
      # `PROBE_SUMMARY n/n` line rather than on an exit code.
      - run: ./scripts/run-probe-on-simulator.sh /tmp/rnmc-probe-ios-derived/Build/Products/Release-iphonesimulator/ExampleApp.app

  interop-level-two:
    # The job name carries which homeserver implementation this leg stands up
    # and whether it additionally stands up a second, federating container
    # for the federated proof (issue #7): the proofs must pass against both
    # Continuwuity and Synapse (issue #8), single and federated, and the only
    # differences between the legs are HOMESERVER_IMPL and FEDERATED, handed
    # to the script below.
    name: interop-level-two (${{ matrix.impl }}, federated=${{ matrix.fed }})
    strategy:
      # One implementation failing must not cancel the other legs: a red
      # Synapse run alongside a green Continuwuity run is exactly the
      # comparison this matrix exists to produce.
      fail-fast: false
      matrix:
        impl: [continuwuity, synapse]
        fed: [0, 1]
    # M2's final exit criterion (design doc section 8): a real Matrix client
    # decrypts what this library encrypted, and this library decrypts what it
    # sent, over a real homeserver -- with a one-character ciphertext
    # corruption observed failing in both directions.
    #
    # Until this job existed, that claim rested on three local runs against a
    # homeserver one person had an account on, recorded in a git-ignored
    # report. `cargo test` in `gates` runs without `--ignored`, so nothing in
    # CI touched it. This job makes the proof repeatable by anyone.
    #
    # NO CREDENTIAL IS INVOLVED, AND THAT IS THE POINT.
    #
    # The obvious alternative was three repository secrets pointing at a real
    # homeserver. That would put Matrix credentials in a public repository's
    # CI, send test traffic to somebody's infrastructure on every pull request
    # including from forks, and leave rooms and devices behind whenever a run
    # failed. Instead the job starts a Continuwuity homeserver in a container,
    # creates the one account the test needs inside it with a password
    # generated per run, and destroys the lot. There is nothing here for a
    # leaked log or a fork's pull request to expose.
    #
    # THE ASSERTION IS IN THE SCRIPT, NOT HERE.
    #
    # Same rule as probe-android: `cargo test` exits 0 when it matches no
    # test at all, so this leg must assert that it FOUND the test reporting
    # `... ok` and a `1 passed; 0 failed; 0 ignored` summary. It must never
    # pass because nothing failed. That assertion lives in
    # scripts/run-level-two-interop.sh so a contributor runs byte-for-byte
    # what CI runs -- which is what makes the proof checkable by a third
    # party rather than a claim from us. It has been watched failing three
    # ways: an uncorrupted control (the test's own assertion fires), a filter
    # that matches no test (cargo exits 0 and the script still refuses), and
    # an image that will not start.
    #
    # `needs: gates` is not about drift here -- this test drives
    # matrix-crypto-core directly and no generated binding is involved. It is
    # so a leg that boots a homeserver and builds the Rust workspace does not
    # run when the cheaper job has already gone red. `gates` also runs
    # `cargo clippy --all-targets`, which is what compiles this test at all.
    #
    # "Cheaper", not "a thirty-second gate", which is what this said until
    # 2026-08-28 and was never true: `gates` runs yarn install, gate:drift (a
    # full codegen including a cargo build of the FFI crate), gate:boundary
    # (which itself runs cargo test -p matrix-crypto-core), cargo fmt, clippy
    # --all-targets, the whole workspace's tests, two typechecks and vitest.
    # Measured warm on a developer machine, gate:boundary alone is 87 s. It is
    # a multi-minute job, and cheap only next to this one.
    needs: gates
    runs-on: ubuntu-latest
    # Docker and a Rust toolchain both come with the hosted runner; nothing
    # here needs a self-hosted one. Measured on a developer machine, the
    # homeserver boots in about two seconds and the test itself takes under
    # ten; the budget below is almost entirely the Rust build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned rather than left to whatever the runner image ships, because
      # the counterparty's dependency set is pinned against a Python version:
      # tests/interop/requirements.txt is the resolution for CPython 3.12 and
      # is installed with --no-deps, so a different interpreter could find a
      # wheel missing rather than silently resolving something else.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      # The second counterparty, for the scanned-code proof. matrix-nio
      # cannot serve that one: its wheel contains no QR vocabulary and no
      # cross-signing vocabulary at all, and a code carries cross-signing
      # keys. The version is read from the module's own `go` directive rather
      # than pinned here, so what this job builds with is what the module
      # declares and there is one place to change it.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: rust/matrix-crypto-core/tests/interop/mautrix_party/go.mod
          cache-dependency-path: rust/matrix-crypto-core/tests/interop/mautrix_party/go.sum
      - run: ./scripts/run-level-two-interop.sh
        env:
          HOMESERVER_IMPL: ${{ matrix.impl }}
          FEDERATED: ${{ matrix.fed }}
