name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  interop-level-two:
    # THROWAWAY BRANCH. Every other job is stripped and `needs: gates` is
    # dropped so this run proves one thing only: that a broken level 2 proof
    # turns this job red. The branch is deleted once it has.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: ./scripts/run-level-two-interop.sh
