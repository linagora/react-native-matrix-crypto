name: docs

on:
  push:
    branches: [main]

# The API reference lives on GitHub Pages, built from the doc comments the
# same sources gate:doc-links already holds to every {@link} resolving. A
# published page that can drift from the source silently is worth less than
# none, so this builds on every merge to main rather than on a schedule.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: api-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
