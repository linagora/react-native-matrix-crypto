name: docs

on:
  push:
    branches: [main]

# The API reference lives on GitHub Pages, built from the doc comments the
# same sources gate:doc-links already holds to every {@link} resolving. A
# published page that can drift from the source silently is worth less than
# none, so this builds on every merge to main rather than on a schedule.
#
# THIS WORKFLOW DEPENDS ON A REPOSITORY SETTING, and nothing here used to say
# so. Pages has to be enabled with its build source set to GitHub Actions.
# `actions/configure-pages` reads that site, it does not create one, and
# without it the build job stops there with `Get Pages site failed. Please
# verify that the repository has Pages enabled ... Not Found`.
#
# It was not enabled, and this never once published a page. From ab25460, the
# commit that added this file, to the day it was switched on: 23 runs, 17 of
# them stopping at that step and 6 cancelled by the `pages` concurrency group
# before reaching it, and not one success. None of that showed up on a pull
# request either, because this workflow runs on push to main alone, so the
# only place the failure was visible is the one place nobody gets a red
# check. Enabled 2026-09-03, one call:
#
#   gh api -X POST repos/linagora/react-native-matrix-crypto/pages \
#     -f build_type=workflow
#
# The page is https://linagora.github.io/react-native-matrix-crypto/. If that
# URL ever 404s, check the setting before reading the build log.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: api-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
